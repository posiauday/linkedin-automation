name: LinkedIn Daily Automation

on:
  schedule:
    - cron: '0 9 * * 1-5'   # 9:00 AM UTC, weekdays only
  workflow_dispatch:
    inputs:
      client:
        description: 'Client slug to run (blank = all clients)'
        required: false
        default: ''
      generate_only:
        description: 'Generate without publishing'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run engine
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ENABLE_IMAGE_GENERATION: ${{ vars.ENABLE_IMAGE_GENERATION }}
          ENABLE_LINKEDIN_POSTING: ${{ inputs.generate_only && 'false' || vars.ENABLE_LINKEDIN_POSTING }}
        run: |
          set -euo pipefail
          COMMAND=$([ "${{ inputs.generate_only }}" = "true" ] && echo generate || echo run)
          if [ -n "${{ inputs.client }}" ]; then
            CLIENTS="${{ inputs.client }}"
          else
            CLIENTS=$(ls clients/*.yaml | xargs -n1 basename | sed 's/\.yaml$//' | grep -v '^_' || true)
          fi
          for SLUG in $CLIENTS; do
            echo "::group::$SLUG"
            python run.py "$COMMAND" --client "$SLUG" || echo "::warning::$SLUG failed, continuing"
            echo "::endgroup::"
          done

      - name: Commit generated posts
        if: always()
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add linkedin_posts/
          git diff --staged --quiet || git commit -m "Posts for $(date +'%Y-%m-%d')"
          git push || echo "nothing to push"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posts-${{ github.run_id }}
          path: linkedin_posts/
          if-no-files-found: ignore
