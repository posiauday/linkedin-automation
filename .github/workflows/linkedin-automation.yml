name: LinkedIn Daily Automation

on:
  # Run daily at 9 AM UTC (adjust to your timezone)
  schedule:
    - cron: '0 9 * * *'  # Daily at 9:00 AM UTC
  
  # Allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  linkedin-automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic requests python-dotenv
      
      - name: Create output directory
        run: mkdir -p linkedin_posts
      
      - name: Run LinkedIn Automation
        env:
          # Add your actual API keys here (configure in GitHub Secrets)
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_ID: ${{ secrets.LINKEDIN_PERSON_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          
          # Configuration
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          DOMAIN_NICHE: ${{ vars.DOMAIN_NICHE }}
          ENABLE_IMAGE_GENERATION: ${{ vars.ENABLE_IMAGE_GENERATION }}
          ENABLE_LINKEDIN_POSTING: ${{ vars.ENABLE_LINKEDIN_POSTING }}
          TEST_MODE: ${{ vars.TEST_MODE }}
        
        run: python linkedin_automation.py
      
      - name: Upload logs as artifact
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: automation-logs
          path: |
            linkedin_automation.log
            linkedin_posts/
      
      - name: Commit posts to repository
        if: success()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add linkedin_posts/ linkedin_automation.log
          git commit -m "Daily LinkedIn post generated - $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
      
      - name: Slack Notification (Optional)
        if: failure()
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "❌ LinkedIn Automation Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "LinkedIn Daily Automation run *failed* on ${{ github.repository }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>"
                  }
                }
              ]
            }
